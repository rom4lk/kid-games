<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8fd4e6" />
    <title>Cube Island</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/game-language.css" />
  </head>
  <body data-translations="translations.json">
    <main class="game-shell" id="game-shell">
      <header class="topbar">
        <section class="goal-panel" aria-label="Current goal">
          <span class="goal-star" id="level-number" aria-hidden="true">1</span>
          <div class="goal-visual" id="goal-visual"></div>
        </section>

        <div class="top-actions" aria-label="Game controls">
          <label class="language-picker language-picker--compact">
            <span aria-hidden="true">🌐</span>
            <span class="language-picker-text">Language</span>
            <select data-language-select aria-label="Interface language">
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </label>
          <button class="round-button" id="hint-button" type="button" aria-label="Show a hint">
            <span class="bulb-icon" aria-hidden="true"></span>
          </button>
          <button class="round-button" id="sound-button" type="button" aria-label="Turn sound off">
            <span class="sound-icon" aria-hidden="true">♪</span>
          </button>
          <button class="round-button" id="pause-button" type="button" aria-label="Pause game">
            <span class="pause-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section class="world-card" aria-label="Cube island">
        <div class="cloud cloud-one" aria-hidden="true"></div>
        <div class="cloud cloud-two" aria-hidden="true"></div>
        <div class="sun" aria-hidden="true"></div>

        <div class="world-frame">
          <div
            class="world"
            id="world"
            role="grid"
            tabindex="0"
            aria-label="Use the arrow keys to move the square cursor, Enter to choose a tile, and Space to use the action button"
          ></div>

          <div class="character hero" id="hero" aria-hidden="true">
            <span class="character-head"><i></i><b></b></span>
            <span class="character-body"></span>
          </div>

          <div class="character friend" id="friend" aria-hidden="true">
            <span class="friend-ear ear-left"></span>
            <span class="friend-ear ear-right"></span>
            <span class="character-head"><i></i><b></b></span>
            <span class="character-body"></span>
          </div>

          <div class="celebration" id="celebration" aria-hidden="true">
            <span>✦</span><span>◆</span><span>✦</span><span>●</span><span>◆</span>
          </div>
        </div>

        <div class="level-complete" id="level-complete" role="dialog" aria-modal="true" aria-label="Level complete" hidden>
          <div class="complete-card">
            <span class="complete-badge" aria-hidden="true">✓</span>
            <p class="complete-level" id="complete-level">Level 1 complete</p>
            <h2 id="complete-title">Bridge built!</h2>
            <p id="complete-text">The bunny can cross now.</p>
            <button class="next-level-button" id="next-level-button" type="button">
              <span id="next-level-label">Next level</span>
              <span aria-hidden="true">▶</span>
            </button>
          </div>
        </div>

        <div class="screen-reader-status" id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="workbench" aria-label="Block tray and action">
        <div class="inventory" id="inventory" aria-label="Available blocks"></div>
        <button class="action-button" id="action-button" type="button" aria-label="No action available" disabled>
          <span class="action-icon" id="action-icon" aria-hidden="true"></span>
          <span class="action-label" id="action-label">Choose</span>
        </button>
      </section>
    </main>

    <div class="pause-overlay" id="pause-overlay" role="dialog" aria-modal="true" aria-label="Game paused" hidden>
      <div class="pause-card">
        <div class="pause-cubes" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="pause-actions">
          <button class="pause-action resume-button" id="resume-button" type="button" aria-label="Resume game">
            <span aria-hidden="true"></span>
          </button>
          <button class="pause-action restart-button" id="restart-button" type="button" aria-label="Start again">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </div>
    </div>

    <script src="../shared/game-language.js"></script>
    <script src="../shared/game-home.js"></script>
    <script src="../shared/game-sound.js"></script>
    <script src="level-data.js"></script>
    <script src="game.js"></script>
  </body>
</html>
