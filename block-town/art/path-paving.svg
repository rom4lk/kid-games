<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The paving of a square: four slabs to the cell, so the pattern runs on into the next cell. -->
  <g fill="none" stroke="#b09a68" stroke-opacity=".35" stroke-width="2">
    <rect x="4" y="4" width="24" height="24" rx="4"/>
    <rect x="36" y="4" width="24" height="24" rx="4"/>
    <rect x="4" y="36" width="24" height="24" rx="4"/>
    <rect x="36" y="36" width="24" height="24" rx="4"/>
  </g>
</svg>
