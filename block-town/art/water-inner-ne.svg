<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- An inside corner of a lake is the tip of the land next to it: the shore wraps round the tip as a quarter circle. -->
  <g transform="rotate(90 32 32)">
  <path d="M0 0H8A8 8 0 0 1 0 8Z" fill="#ecdcae"/>
  <path d="M8 0A8 8 0 0 1 0 8" fill="none" stroke="#3f9dc4" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
