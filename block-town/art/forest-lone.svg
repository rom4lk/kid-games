<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A lone forest cell: the meadow, the ground shadow and the trunk. The crown is forest-lone-crown.svg, laid over it by the game so it can sway. The trunk reaches up under the crown, so a bob never opens a gap. -->
