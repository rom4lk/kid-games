<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183f36" />
    <title>Forest Light</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/game-language.css" />
  </head>
  <body data-translations="translations.json">
    <svg class="symbol-library" aria-hidden="true">
      <symbol id="icon-branch" viewBox="0 0 64 64">
        <path class="branch-main" d="M11 48C23 39 32 29 51 13" />
        <path class="branch-tip" d="M29 33 20 21M39 25l2-13M22 40l-12-1" />
        <path class="branch-leaf" d="M43 19c7-7 13-6 15-5-1 6-6 11-15 9z" />
      </symbol>
      <symbol id="icon-stone" viewBox="0 0 64 64">
        <path class="stone-main" d="M10 46 16 25 29 13 47 19 56 39 45 51 22 53z" />
        <path class="stone-shine" d="m22 28 9-8 9 3-8 4z" />
      </symbol>
      <symbol id="icon-berry" viewBox="0 0 64 64">
        <path class="berry-stem" d="M32 22c0-8 5-12 11-13" />
        <circle class="berry-fill" cx="23" cy="40" r="14" />
        <circle class="berry-fill" cx="42" cy="44" r="11" />
        <circle class="berry-shine" cx="19" cy="35" r="4" />
      </symbol>
      <symbol id="icon-bush" viewBox="0 0 64 64">
        <path class="bush-leaves" d="M32 8c9 0 13 7 13 12 7 1 11 6 11 12s-5 12-13 12H21C13 44 8 39 8 32s5-11 11-12c0-5 4-12 13-12z" />
        <circle class="berry-fill" cx="22" cy="30" r="6" />
        <circle class="berry-fill" cx="40" cy="26" r="6" />
        <circle class="berry-fill" cx="32" cy="38" r="6" />
        <path class="bush-stem" d="M32 44v13M32 50l-8 6M32 50l8 6" />
      </symbol>
      <symbol id="icon-fire" viewBox="0 0 64 64">
        <path class="fire-outer" d="M32 6c2 13-11 15-7 28 2 6 8 10 8 10s-1-8 5-14c0 9 8 10 7 19-2 8-10 12-18 9C10 52 11 35 20 25c8-9 10-12 12-19z" />
        <path class="fire-inner" d="M31 38c-4 5-5 11 1 14 5 2 10-2 9-7-1-4-4-5-4-10-2 4-4 4-6 3z" />
      </symbol>
      <symbol id="icon-torch" viewBox="0 0 64 64">
        <path class="torch-handle" d="M28 30 22 58" />
        <path class="torch-cup" d="M20 24h22l-4 12H24z" />
        <path class="fire-outer" d="M31 4c1 8-8 10-5 18 2 4 6 6 6 6s-1-5 3-9c0 6 5 7 4 12-1 5-6 7-11 5-7-3-6-13-1-19 5-5 4-9 4-13z" />
      </symbol>
      <symbol id="icon-bowl" viewBox="0 0 64 64">
        <circle class="berry-fill" cx="25" cy="27" r="8" />
        <circle class="berry-fill" cx="39" cy="25" r="8" />
        <path class="bowl-body" d="M7 32h50c0 14-11 22-25 22S7 46 7 32z" />
        <path class="bowl-rim" d="M5 32h54" />
      </symbol>
      <symbol id="icon-pocket" viewBox="0 0 64 64">
        <path class="pocket-line" d="M14 20h36v20a18 18 0 0 1-36 0zM14 26h36" />
      </symbol>
      <symbol id="icon-hand" viewBox="0 0 64 64">
        <path class="hand-fill" d="M24 35V14c0-5 8-5 8 0v16-20c0-5 8-5 8 0v20-15c0-5 8-5 8 0v18-10c0-5 8-5 8 0v20c0 11-8 17-19 17h-4c-7 0-12-3-16-8L8 40c-3-4 3-9 7-6z" />
        <path class="hand-line" d="M32 30V14M40 30V10M48 33V15" />
      </symbol>
      <symbol id="icon-shake" viewBox="0 0 64 64">
        <path class="hand-fill" d="M25 38V22c0-4 7-4 7 0v10-14c0-4 7-4 7 0v14-9c0-4 7-4 7 0v20c0 9-6 14-15 14-6 0-10-3-13-7l-6-9c-3-4 3-8 6-5z" />
        <path class="shake-arc" d="M13 18c-4 4-5 10-3 15M9 12c-7 6-8 16-4 23" />
        <path class="shake-arc" d="M53 14c4 4 5 10 3 15" />
      </symbol>
      <symbol id="icon-shovel" viewBox="0 0 64 64">
        <path class="shovel-handle" d="M40 10 24 38" />
        <path class="shovel-grip" d="M33 6h14v10H33z" />
        <path class="shovel-blade" d="M27 32 14 52c-2 4 2 8 6 6l19-11z" />
      </symbol>
      <symbol id="icon-hammer" viewBox="0 0 64 64">
        <path class="hammer-handle" d="m22 52 22-31" />
        <path class="hammer-head" d="m28 12 8-6 20 14-7 10z" />
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 64 64">
        <circle class="sun-fill" cx="32" cy="32" r="15" />
        <path class="sun-ray" d="M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M52 12l-6 6M18 46l-6 6" />
      </symbol>
      <symbol id="icon-sun-low" viewBox="0 0 64 64">
        <path class="sun-fill" d="M14 42a18 18 0 0 1 36 0z" />
        <path class="sun-ray" d="M4 50h56M32 8v10M11 20l6 6M53 20l-6 6" />
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 64 64">
        <path class="moon-fill" d="M42 8a24 24 0 1 0 14 34A25 25 0 0 1 42 8z" />
        <path class="moon-star" d="m17 12 2 5 5 2-5 2-2 5-2-5-5-2 5-2z" />
      </symbol>
      <symbol id="icon-tent" viewBox="0 0 64 64">
        <path class="tent-body" d="M32 8 58 52H6z" />
        <path class="tent-door" d="M32 24 44 52H20z" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 64 64">
        <path class="ui-icon-line" d="M40 12 20 32l20 20" />
      </symbol>
      <symbol id="icon-volume" viewBox="0 0 64 64">
        <path class="ui-icon-fill" d="M10 25h12L37 13v38L22 39H10z" />
        <path class="ui-icon-line" d="M44 23c6 5 6 13 0 18M50 16c11 9 11 23 0 32" />
      </symbol>
      <symbol id="icon-volume-off" viewBox="0 0 64 64">
        <path class="ui-icon-fill" d="M10 25h12L37 13v38L22 39H10z" />
        <path class="ui-icon-line" d="m45 24 14 16M59 24 45 40" />
      </symbol>
      <symbol id="icon-hint" viewBox="0 0 64 64">
        <path class="ui-icon-fill" d="M32 7a18 18 0 0 1 11 32c-2 2-3 4-3 6H24c0-2-1-4-3-6A18 18 0 0 1 32 7z" />
        <path class="ui-icon-line" d="M25 51h14M28 57h8" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 64 64">
        <path class="ui-icon-fill" d="M16 12h12v40H16zM36 12h12v40H36z" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 64 64">
        <path class="ui-icon-fill" d="m19 10 36 22-36 22z" />
      </symbol>
      <symbol id="icon-restart" viewBox="0 0 64 64">
        <path class="ui-icon-line" d="M17 21a21 21 0 1 1-3 25" />
        <path class="ui-icon-fill" d="M7 9v19h19z" />
      </symbol>
      <symbol id="icon-firefly" viewBox="0 0 64 64">
        <ellipse class="firefly-wing" cx="22" cy="29" rx="12" ry="8" transform="rotate(-30 22 29)" />
        <ellipse class="firefly-wing" cx="42" cy="29" rx="12" ry="8" transform="rotate(30 42 29)" />
        <path class="firefly-body" d="M27 21h10l3 23-8 10-8-10z" />
        <circle class="firefly-glow" cx="32" cy="43" r="9" />
      </symbol>
      <symbol id="icon-star" viewBox="0 0 64 64">
        <path class="star-fill" d="m32 5 8 18 20 2-15 14 4 20-17-10-17 10 4-20L4 25l20-2z" />
      </symbol>
    </svg>

    <main class="game-shell" id="game-shell">
      <section class="world" id="world" aria-label="Forest clearing" data-glade="camp" data-daylight="1">
        <div class="world-map" id="world-map">
          <div class="glade" data-glade="berries">
            <div class="glade-decor" aria-hidden="true">
              <span class="hollow"></span>
              <span class="tree tree-one"><span></span></span>
              <span class="tree tree-two"><span></span></span>
              <span class="tree tree-five"><span></span></span>
            </div>
            <div class="glade-resources"></div>
          </div>

          <div class="glade" data-glade="camp">
            <div class="glade-decor" aria-hidden="true">
              <span class="pond"><span></span></span>
              <span class="tree tree-one"><span></span></span>
              <span class="tree tree-two"><span></span></span>
              <span class="tree tree-three"><span></span></span>
              <span class="tree tree-four"><span></span></span>
              <span class="tree tree-five"><span></span></span>
              <span class="tree tree-six"><span></span></span>
            </div>

            <div class="camp-spots">
              <button class="build-spot" type="button" data-recipe="torch" aria-label="Build the torch" disabled>
                <span class="build-result"><svg viewBox="0 0 64 64"><use href="#icon-torch"></use></svg></span>
                <span class="build-sockets">
                  <span class="build-socket" data-kind="branch"><svg viewBox="0 0 64 64"><use href="#icon-branch"></use></svg></span>
                  <span class="build-socket" data-kind="stone"><svg viewBox="0 0 64 64"><use href="#icon-stone"></use></svg></span>
                </span>
                <span class="build-badge" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-hammer"></use></svg></span>
              </button>

              <button class="build-spot build-spot-goal" id="camp" type="button" data-recipe="fire" aria-label="Build the campfire" disabled>
                <span class="build-result"><svg viewBox="0 0 64 64"><use href="#icon-fire"></use></svg></span>
                <span class="build-sockets">
                  <span class="build-socket" data-kind="branch"><svg viewBox="0 0 64 64"><use href="#icon-branch"></use></svg></span>
                  <span class="build-socket" data-kind="branch"><svg viewBox="0 0 64 64"><use href="#icon-branch"></use></svg></span>
                  <span class="build-socket" data-kind="stone"><svg viewBox="0 0 64 64"><use href="#icon-stone"></use></svg></span>
                </span>
                <span class="build-badge" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-hammer"></use></svg></span>
              </button>

              <button class="build-spot" type="button" data-recipe="bowl" aria-label="Build the berry bowl" disabled>
                <span class="build-result"><svg viewBox="0 0 64 64"><use href="#icon-bowl"></use></svg></span>
                <span class="build-sockets">
                  <span class="build-socket" data-kind="berry"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
                  <span class="build-socket" data-kind="berry"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
                </span>
                <span class="build-badge" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-hammer"></use></svg></span>
              </button>
            </div>

            <div class="glade-resources"></div>
          </div>

          <div class="glade" data-glade="stones">
            <div class="glade-decor" aria-hidden="true">
              <span class="slope"></span>
              <span class="tree tree-one"><span></span></span>
              <span class="tree tree-six"><span></span></span>
            </div>
            <div class="glade-resources"></div>
          </div>
        </div>

        <div class="night-veil" aria-hidden="true"></div>

        <button class="glade-edge glade-edge-left" type="button" data-direction="-1" aria-label="Go to the berry hollow">
          <span class="glade-edge-arrow" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-arrow"></use></svg></span>
          <span class="glade-edge-icon"><svg viewBox="0 0 64 64"><use href="#icon-bush"></use></svg></span>
        </button>
        <button class="glade-edge glade-edge-right" type="button" data-direction="1" aria-label="Go to the stone slope">
          <span class="glade-edge-arrow" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-arrow"></use></svg></span>
          <span class="glade-edge-icon"><svg viewBox="0 0 64 64"><use href="#icon-stone"></use></svg></span>
        </button>

        <header class="hud">
          <div class="goal-cluster" aria-label="Goal: two branches and one stone make a campfire">
            <div class="firefly" id="firefly" aria-hidden="true">
              <svg viewBox="0 0 64 64"><use href="#icon-firefly"></use></svg>
            </div>
            <div class="goal-bubble">
              <span class="goal-socket" data-kind="branch"><svg viewBox="0 0 64 64"><use href="#icon-branch"></use></svg></span>
              <span class="goal-socket" data-kind="branch"><svg viewBox="0 0 64 64"><use href="#icon-branch"></use></svg></span>
              <span class="goal-socket" data-kind="stone"><svg viewBox="0 0 64 64"><use href="#icon-stone"></use></svg></span>
              <span class="goal-arrow" aria-hidden="true">→</span>
              <span class="goal-result"><svg viewBox="0 0 64 64"><use href="#icon-fire"></use></svg></span>
            </div>
          </div>

          <div class="meter-cluster">
            <div class="sun-path" aria-label="Sun path">
              <span class="sun-mark is-current"><svg viewBox="0 0 64 64"><use href="#icon-sun"></use></svg></span>
              <span class="sun-mark"><svg viewBox="0 0 64 64"><use href="#icon-sun"></use></svg></span>
              <span class="sun-mark"><svg viewBox="0 0 64 64"><use href="#icon-sun-low"></use></svg></span>
              <span class="sun-mark"><svg viewBox="0 0 64 64"><use href="#icon-moon"></use></svg></span>
            </div>
            <div class="fullness" aria-label="Fullness">
              <span class="fullness-mark"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
              <span class="fullness-mark"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
              <span class="fullness-mark"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
            </div>
          </div>

          <div class="control-cluster">
            <label class="language-picker language-picker--compact">
              <span aria-hidden="true">🌐</span>
              <span class="language-picker-text">Language</span>
              <select data-language-select aria-label="Interface language">
                <option value="en">English</option>
                <option value="ru">Русский</option>
              </select>
            </label>
            <button class="round-control" id="hint-button" type="button" aria-label="Repeat the hint">
              <svg viewBox="0 0 64 64"><use href="#icon-hint"></use></svg>
            </button>
            <button class="round-control" id="sound-button" type="button" aria-label="Turn sound off">
              <svg class="sound-on" viewBox="0 0 64 64"><use href="#icon-volume"></use></svg>
              <svg class="sound-off" viewBox="0 0 64 64"><use href="#icon-volume-off"></use></svg>
            </button>
            <button class="round-control" id="pause-button" type="button" aria-label="Pause">
              <svg viewBox="0 0 64 64"><use href="#icon-pause"></use></svg>
            </button>
          </div>
        </header>

        <div class="player" id="player" aria-label="Forest explorer">
          <span class="player-shadow"></span>
          <span class="player-legs"></span>
          <span class="player-body"></span>
          <span class="player-pack"></span>
          <span class="player-head"><i></i></span>
          <span class="player-bubble" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-berry"></use></svg></span>
        </div>

        <div class="hint-hand" id="hint-hand" aria-hidden="true">
          <svg viewBox="0 0 64 64"><use href="#icon-hand"></use></svg>
        </div>

        <footer class="action-bar">
          <div class="inventory" aria-label="Backpack with supplies">
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
            <button class="inventory-slot is-empty" type="button" aria-label="Empty pocket" disabled>
              <svg viewBox="0 0 64 64"><use href="#icon-pocket"></use></svg>
            </button>
          </div>
          <div class="action-column">
            <div class="action-progress" aria-hidden="true">
              <span class="action-pip" hidden></span>
              <span class="action-pip" hidden></span>
              <span class="action-pip" hidden></span>
            </div>
            <button class="main-action" id="main-action" type="button" data-verb="none" aria-label="Pick up the item" disabled>
              <svg class="action-icon action-pick" viewBox="0 0 64 64"><use href="#icon-hand"></use></svg>
              <svg class="action-icon action-shake" viewBox="0 0 64 64"><use href="#icon-shake"></use></svg>
              <svg class="action-icon action-dig" viewBox="0 0 64 64"><use href="#icon-shovel"></use></svg>
              <svg class="action-icon action-light" viewBox="0 0 64 64"><use href="#icon-fire"></use></svg>
            </button>
          </div>
        </footer>

        <div class="pause-overlay" id="pause-overlay" aria-hidden="true">
          <div class="pause-fire" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#icon-fire"></use></svg></div>
          <button class="resume-button" id="resume-button" type="button" aria-label="Continue">
            <svg viewBox="0 0 64 64"><use href="#icon-play"></use></svg>
          </button>
        </div>

        <div class="victory-overlay" id="victory-overlay" aria-hidden="true">
          <div class="stars" aria-hidden="true">
            <svg viewBox="0 0 64 64"><use href="#icon-star"></use></svg>
            <svg viewBox="0 0 64 64"><use href="#icon-star"></use></svg>
            <svg viewBox="0 0 64 64"><use href="#icon-star"></use></svg>
          </div>
          <div class="victory-friends" aria-hidden="true"><span></span><i></i><b></b></div>
          <button class="restart-button" id="restart-button" type="button" aria-label="Play again">
            <svg viewBox="0 0 64 64"><use href="#icon-restart"></use></svg>
          </button>
        </div>

        <div class="sr-only" id="live-status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="../shared/game-language.js"></script>
    <script src="../shared/game-home.js"></script>
    <script src="../shared/game-sound.js"></script>
    <script src="game.js"></script>
  </body>
</html>
