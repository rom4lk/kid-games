<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7c85c" />
    <title>Robo Route</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/game-language.css" />
  </head>
  <body data-translations="translations.json">
    <main class="game-shell">
      <header class="top-bar">
        <div class="goal-card" aria-label="Goal: move the parcel to the delivery station">
          <span class="goal-parcel" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M13 22 32 12l19 10v25L32 57 13 47z" />
              <path d="m13 22 19 10 19-10M32 32v25M24 16l19 10" />
              <path class="parcel-star" d="m32 34 2.3 4.7 5.2.7-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.7z" />
            </svg>
          </span>
          <span class="goal-arrow" aria-hidden="true">
            <svg viewBox="0 0 72 40">
              <path d="M8 20h48" />
              <path d="m44 8 14 12-14 12" />
            </svg>
          </span>
          <span class="goal-station" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M12 27 32 10l20 17v27H12z" />
              <path d="M24 54V36h16v18M28 42h8" />
            </svg>
          </span>
        </div>

        <div class="top-settings">
          <label class="language-picker language-picker--compact">
            <span aria-hidden="true">🌐</span>
            <span class="language-picker-text">Language</span>
            <select data-language-select aria-label="Interface language">
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </label>
          <button class="round-button sound-button is-on" id="soundButton" aria-label="Turn sound off">
            <svg class="sound-on" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M9 20h8l10-8v24l-10-8H9z" />
              <path d="M33 18c3.5 3 3.5 9 0 12M38 13c7 6 7 16 0 22" />
            </svg>
            <svg class="sound-off" viewBox="0 0 48 48" aria-hidden="true">
              <path d="M9 20h8l10-8v24l-10-8H9z" />
              <path d="m33 18 9 12M42 18l-9 12" />
            </svg>
          </button>
        </div>
      </header>

      <section class="world-card" aria-label="Game world">
        <nav class="level-progress" id="levelProgress" aria-label="Levels"></nav>

        <div class="world-sky" aria-hidden="true">
          <span class="cloud cloud-one"></span>
          <span class="cloud cloud-two"></span>
          <span class="hill hill-one"></span>
          <span class="hill hill-two"></span>
        </div>

        <button class="hint-button" id="hintButton" aria-label="Show a hint">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M16 29c-3-2.4-5-6-5-10a13 13 0 0 1 26 0c0 4-2 7.6-5 10-1.8 1.5-2.7 3-2.7 5h-10.6c0-2-1-3.6-2.7-5z" />
            <path d="M19 38h10M21 42h6" />
            <path class="hint-rays" d="M24 2v4M8 8l3 3M40 8l-3 3M3 22h4M41 22h4" />
          </svg>
        </button>

        <div class="track" id="track">
          <div class="track-tiles" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>

          <div class="obstacles" id="obstacles" aria-hidden="true"></div>

          <div class="delivery-station" aria-hidden="true">
            <div class="station-roof"></div>
            <div class="station-body">
              <div class="station-window"></div>
              <div class="station-bay">
                <span class="station-glow"></span>
              </div>
            </div>
            <div class="station-light"></div>
          </div>

          <div class="parcel" id="parcel" aria-hidden="true">
            <span class="parcel-lid"></span>
            <span class="parcel-ribbon"></span>
            <svg viewBox="0 0 32 32">
              <path d="m16 6 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4-4.6-4.5 6.4-.9z" />
            </svg>
          </div>

          <div class="robot" id="robot" aria-hidden="true">
            <img src="assets/robo-mascot.png" alt="" />
            <div class="held-parcel">
              <span class="parcel-lid"></span>
              <span class="parcel-ribbon"></span>
              <svg viewBox="0 0 32 32">
                <path d="m16 6 2.8 5.8 6.4.9-4.6 4.5 1.1 6.4-5.7-3-5.7 3 1.1-6.4-4.6-4.5 6.4-.9z" />
              </svg>
            </div>
          </div>
        </div>

        <div class="success-layer" id="successLayer" aria-hidden="true">
          <div class="success-star">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path d="m60 8 14 29 32 5-23 22 6 32-29-15-29 15 6-32-23-22 32-5z" />
              <path class="star-face" d="M42 56h7M71 56h7M45 70c9 9 21 9 30 0" />
            </svg>
          </div>
          <div class="final-parade" id="finalParade" aria-hidden="true"></div>
          <button class="again-button" id="againButton" aria-label="Next level">
            <svg class="next-icon" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M11 32h40M38 18l14 14-14 14" />
            </svg>
            <svg class="replay-icon" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M17 20A21 21 0 1 1 12 38" />
              <path d="M8 16h13v13" />
            </svg>
          </button>
        </div>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
      </section>

      <section class="program-card" aria-label="Build a route">
        <div class="program-row">
          <button class="clear-button" id="clearButton" aria-label="Clear commands">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M13 15h22M19 10h10M17 20l2 19h10l2-19" />
              <path d="M23 24v10M27 24v10" />
            </svg>
          </button>

          <div class="program-strip" id="programStrip" role="list" aria-label="Command sequence"></div>

          <button class="play-button" id="playButton" aria-label="Run commands">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="m24 16 26 16-26 16z" />
            </svg>
          </button>
        </div>

        <div class="coach" id="coach" aria-hidden="true">
          <span class="coach-finger">
            <svg viewBox="0 0 64 76">
              <path d="M27 37V13a7 7 0 0 1 14 0v19l4-4a7 7 0 0 1 10 10L42 55a16 16 0 0 1-13 7h-5a16 16 0 0 1-14-8L4 43a7 7 0 0 1 12-7l4 6V37a7 7 0 0 1 7-7z" />
            </svg>
          </span>
          <span class="coach-sparkle">✦</span>
        </div>

        <div class="command-palette" id="commandPalette" aria-label="Commands">
          <button class="command-button command-left" data-command="left" aria-label="Move left">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-arrow" d="M55 32H14M28 17 13 32l15 15" />
              <path class="command-trail" d="M48 49h.1M57 49h.1" />
            </svg>
          </button>
          <button class="command-button command-pick" data-command="pick" aria-label="Pick up">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-box" d="M22 34h32v22H22zM22 34l16 8 16-8M38 42v14" />
              <path class="command-arrow" d="M11 48V12M4 20l7-8 7 8" />
            </svg>
          </button>
          <button class="command-button command-right" data-command="right" aria-label="Move right">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-arrow" d="M9 32h41M36 17l15 15-15 15" />
              <path class="command-trail" d="M7 49h.1M16 49h.1" />
            </svg>
          </button>
          <button class="command-button command-drop" data-command="drop" aria-label="Put down">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-box" d="M22 8h32v22H22zM22 8l16 8 16-8M38 16v14" />
              <path class="command-arrow" d="M11 8v36M4 36l7 8 7-8" />
              <path class="command-ground" d="M4 55h52" />
            </svg>
          </button>
          <button class="command-button command-up" data-command="up" aria-label="Move up">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-arrow" d="M32 55V14M17 28l15-15 15 15" />
              <path class="command-trail" d="M49 48v.1M49 57v.1" />
            </svg>
          </button>
          <button class="command-button command-down" data-command="down" aria-label="Move down">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path class="command-arrow" d="M32 9v41M17 36l15 15 15-15" />
              <path class="command-trail" d="M49 7v.1M49 16v.1" />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <script src="../shared/game-language.js"></script>
    <script src="../shared/game-sound.js"></script>
    <script src="game.js"></script>
  </body>
</html>
